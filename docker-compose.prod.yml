# Production override for docker-compose.yml. Always load this file after the
# base compose file; Compose includes cannot override imported services.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  spring-backend:
    build: !reset null
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: always
    environment:
      # Production must migrate first, then let Hibernate detect any remaining drift.
      FLYWAY_ENABLED: "true"
      HIBERNATE_DDL_AUTO: validate
      PRODUCTION_CONFIG_VALIDATION_ENABLED: "true"
      # Keep the production realtime path enabled and fail closed if required
      # provider credentials are not present in the VPS .env/secret store.
      REALTIME_OUTBOX_ENABLED: "true"
      WEBSOCKET_STOMP_ENABLED: "true"
      VIDEO_STORAGE_PROVIDER: ${VIDEO_STORAGE_PROVIDER:-R2}
      # Bunny credentials are required only when VIDEO_STORAGE_PROVIDER is
      # BUNNY_VIDEO; production-preflight and the application validator enforce that.
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_TOKEN_AUTH_KEY: ${BUNNY_STREAM_TOKEN_AUTH_KEY:-}
      BUNNY_STREAM_WEBHOOK_SECRET: ${BUNNY_STREAM_WEBHOOK_SECRET:-}
      # Production origins must be supplied by the VPS environment and are
      # rejected by ops/production-preflight.sh if local or wildcard values.
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:?CORS_ALLOWED_ORIGIN_PATTERNS is required}"
    logging: *default-logging

