# Production override for docker-compose.yml. Always load this file after the
# base compose file; Compose includes cannot override imported services.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  spring-backend:
    build: !reset null
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: always
    environment:
      # Production must migrate first, then let Hibernate detect any remaining drift.
      FLYWAY_ENABLED: "true"
      HIBERNATE_DDL_AUTO: validate
      PRODUCTION_CONFIG_VALIDATION_ENABLED: "true"
      # Production origins must be supplied by the VPS environment and are
      # rejected by ops/production-preflight.sh if local or wildcard values.
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:?CORS_ALLOWED_ORIGIN_PATTERNS is required}"
    logging: *default-logging

