spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

management:
  health:
    rabbit:
      enabled: false
    mail:
      enabled: false

application:
  group-sessions:
    enabled: true
  scheduling:
    # Integration tests invoke lifecycle services explicitly. Background jobs would
    # mutate shared in-memory data between test contexts and make CI nondeterministic.
    enabled: false
  websocket:
    stomp:
      enabled: false
  realtime:
    outbox:
      enabled: false
  cursor:
    crypto:
      version: v1
      aes-key: Q3Vyc29yUGhhc2UxQWVzS2V5Rm9yU2tpbGxTd2FwMDE=
      hmac-key: Q3Vyc29yUGhhc2UxSG1hY0tleUZvclNraWxsU3dhcDAx
