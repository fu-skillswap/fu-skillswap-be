spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5444/skillswapdb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # UUID v7 changed primary-key types; use a fresh dev schema instead of updating an old BIGINT schema.
      ddl-auto: create
    show-sql: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

application:
  google:
    client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0c2VjcmV0}
      refresh-token:
        cookie:
          secure: ${JWT_REFRESH_COOKIE_SECURE:false}
          same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}
  upload:
    dir: ./uploads/files
  cors:
    # Local development only. Production overrides this with explicit HTTPS origins.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  storage:
    video-provider: ${VIDEO_STORAGE_PROVIDER:R2}
  mail:
    enabled: ${APPLICATION_MAIL_ENABLED:false}
    from: ${APPLICATION_MAIL_FROM:no-reply@skillswap.asia}
    from-name: ${APPLICATION_MAIL_FROM_NAME:SkillSwap}

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
