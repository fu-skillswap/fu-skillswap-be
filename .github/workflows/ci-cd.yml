name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Superseded PR/dev runs are cancelled to free runners. Main is deliberately
  # not cancelled because its workflow can already be deploying to production.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  # Keep this existing job id so current branch-protection checks remain valid.
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillswap_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Keep collecting the architecture report while allowing the currently
    # documented Modulith debt to remain non-blocking for functional release CI.
    - name: Report Spring Modulith boundaries
      timeout-minutes: 5
      continue-on-error: true
      run: mvn -B -ntp -Pmodulith-architecture-audit test

    - name: Check test boundary regression
      run: pwsh -File scripts/check-test-boundary.ps1 -Strict

    - name: Check Modulith audit edge delta
      if: always()
      run: bash scripts/check-modulith-audit-delta.sh

    - name: Upload Modulith audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: modulith-audit-report
        path: |
          target/modulith-audit-edges.csv
          target/surefire-reports/com.fptu.exe.skillswap.architecture.ModulithArchitectureAuditTest.*
        if-no-files-found: ignore

    - name: Enforce ArchUnit boundaries
      timeout-minutes: 5
      run: mvn -B -ntp "-Dtest=ArchitectureGuardrailTest,NegativeGuardrailArchUnitTest" test

    - name: Validate Flyway and Hibernate schema on PostgreSQL
      timeout-minutes: 15
      env:
        SPRING_PROFILES_ACTIVE: test
        TEST_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/skillswap_test
        TEST_DATASOURCE_USERNAME: test
        TEST_DATASOURCE_PASSWORD: test
      run: |
        mvn -B -ntp "-Dtest=FlywayPostgresSchemaValidationTest" test
        echo "PostgreSQL Flyway migration and Hibernate validation executed"

    - name: Run unit and component tests
      timeout-minutes: 25
      env:
        SPRING_PROFILES_ACTIVE: test
        TEST_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/skillswap_test
        TEST_DATASOURCE_USERNAME: test
        TEST_DATASOURCE_PASSWORD: test
      run: mvn -B -ntp test

    - name: Upload test reports on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: |
          target/surefire-reports/**
        if-no-files-found: ignore

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillswap_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Failsafe integration tests and package release JAR
      timeout-minutes: 25
      env:
        SPRING_PROFILES_ACTIVE: test
        TEST_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/skillswap_test
        TEST_DATASOURCE_USERNAME: test
        TEST_DATASOURCE_PASSWORD: test
      run: |
        mvn --version
        # Always build from a clean target directory. The mentor service-resource
        # aggregate was retired by V122; reusing a cached target directory could
        # leave its old JPA classes in the release JAR while Flyway has already
        # dropped the corresponding tables, causing Hibernate schema validation
        # to fail at startup.
        mvn -B -ntp clean -DskipUnitTests=true verify

        release_jar="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
        test -n "$release_jar"
        if jar tf "$release_jar" | grep -Eq 'BOOT-INF/classes/com/fptu/exe/skillswap/modules/mentor/(domain|repository|service|controller)/MentorServiceResource'; then
          echo "Retired mentor service-resource classes leaked into release artifact: $release_jar"
          exit 1
        fi

    # This contract is generated by SwaggerExposureEnabledIntegrationTest.
    - name: Upload generated OpenAPI contract
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: openapi-contract
        path: target/openapi.json
        if-no-files-found: error

    - name: Upload Application JAR
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: target/*.jar
        if-no-files-found: error
        retention-days: 1

    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-reports
        path: |
          target/failsafe-reports/**
        if-no-files-found: ignore

  security-scan:
    # Trivy resolves missing Java POMs from Maven Central. Starting after the
    # Maven build lets setup-java restore the same dependency cache instead of
    # three cold jobs downloading the dependency graph at once.
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21 and restore Maven cache
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Resolve Maven dependencies for Trivy
      run: |
        mvn --version
        mvn -B -ntp dependency:resolve -DincludeScope=test

    - name: Run Trivy vulnerability scanner in repo mode
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        ignore-unfixed: true
        format: 'table'
        severity: 'CRITICAL,HIGH'
        cache: 'true'
        timeout: '10m'

  release-preflight:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate release scripts and compose topology
      run: |
        set -euo pipefail
        REQUIRE_CLEAN_WORKTREE=true sh ops/release-preflight.sh
        sh scripts/verify-migration-policy.sh

  docker-publish:
    needs: [build-and-test, integration-test, security-scan, release-preflight]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Application JAR
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: target

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ github.sha }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.ci
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-vps:
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: skillswap-production-deploy
      cancel-in-progress: false
    steps:
    - name: Validate VPS deployment secrets
      shell: bash
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      run: |
        set -euo pipefail
        missing=0
        for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
          if [ -z "${!name:-}" ]; then
            echo "::error::Required GitHub Actions secret ${name} is missing or empty."
            missing=1
          else
            echo "${name}=configured"
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Fix: configure the missing secret in repository Settings > Secrets and variables > Actions."
          exit 1
        fi

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        RELEASE_DIR: ${{ vars.RELEASE_DIR }}
        BACKUP_DIR: ${{ vars.BACKUP_DIR }}
        APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        REGISTRY: ${{ env.REGISTRY }}
        REGISTRY_USERNAME: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
        RELEASE_SHA: ${{ github.sha }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        command_timeout: 30m
        envs: DEPLOY_DIR,RELEASE_DIR,BACKUP_DIR,APP_IMAGE,REGISTRY,REGISTRY_USERNAME,REGISTRY_TOKEN,REPOSITORY,RELEASE_SHA
        script_stop: true
        debug: false
        script: |
          set -euo pipefail
          deploy_tmp="$(mktemp -d)"
          trap 'rm -rf "$deploy_tmp"' EXIT
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${REPOSITORY}/${RELEASE_SHA}/ops/deploy-vps.sh" \
            -o "$deploy_tmp/deploy-vps.sh"
          chmod 700 "$deploy_tmp/deploy-vps.sh"
          "$deploy_tmp/deploy-vps.sh"
